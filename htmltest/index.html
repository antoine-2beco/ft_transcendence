<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Transcendance test</title>
        <script type ="module" src="main.js" defer></script>
    </head>
    <body>
        <h1>Transcendance test</h1>

        <section>
          <h2>Register</h2>
          <input id="usernameregister" placeholder="username" />
          <input id="emailregister" placeholder="email" />
          <input id="passwordregister" type="password" placeholder="password" />
          <button id="register">Register</button>
        </section>
        
        <section>
          <h2>Login</h2>
          <input id="usernamelogin" placeholder="username" />
          <input id="passwordlogin" type="password" placeholder="password" />
          <button id="login">Login</button>
        </section>
        <img id="myPfp" alt="my profile picture" style="width:64px;height:64px;border-radius:50%;display:none;" />
        <h2>Add friend</h2>
        <input id="friendId" placeholder="User ID" />
        <button id="addFriend">Add Friend</button>
        <h2>Upload profile picture</h2>
        <input type="file" id="profilePic" accept="image/*" />
        <button id="uploadPic">Upload</button>

        <br /><br />
        <img id="profilePreview" style="max-width:200px;" />

        <section>
          <button id="queue">Join matchmaking</button>
        </section>


        <section>
		  <button id="playai" disabled>Play AI</button>
        </section>
        
        <div id="status"></div>
        <div id="board" style="display:grid;grid-template-columns:repeat(3,60px);gap:6px;margin-top:12px;"></div>
        <pre id="log"></pre>
    </body>

</html>
